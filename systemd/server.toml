# Sshcast Coordinator Server Configuration (/etc/sshcast/server.toml)

# Fallback listen address when NOT using systemd socket activation (LISTEN_FDS).
# Under systemd, enable sshcast-server.socket (/run/sshcast/server.sock for Nginx)
# and/or sshcast-server-tcp@<port>.socket (127.0.0.1:<port> for Cloudflare Tunnel).
listen_addr = "unix:/run/sshcast/server.sock"

# Optional TLS certificate & key (leave empty for h2c cleartext HTTP/2 behind Nginx/Cloudflare)
tls_cert_file = ""
tls_key_file = ""

# Set to true only for testing or private open networks; otherwise specify trusted_operator_pubkeys or allowed_user_pubkeys
allow_any_user = false

# List of trusted Operator Ed25519 public keys (sc_op_pub_<hex> from sshcast-operator --keygen).
# Any user holding a valid UserCert signed by one of these operator keys is automatically authorized.
trusted_operator_pubkeys = [
  # "sc_op_pub_..."
]

# List of explicitly allowed User Root Ed25519 public keys (hex or base64 or sc_pub_... produced by sshcast-client keygen)
allowed_user_pubkeys = [
  # "sc_pub_..."
]

# Fast workstation receipt timeout before failing over to secondary workstation (default: 1500ms)
sign_ack_timeout_ms = 1500

# Maximum time to wait for human approval after SignAck is received (default: 60000ms)
sign_response_timeout_ms = 60000

# Interval for server-to-workstation heartbeat frames to keep Cloudflare/Nginx streams alive (default: 25000ms)
heartbeat_interval_ms = 25000
